<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded high-contrast base for seamless clarity on light and dark browser chrome -->
  <rect width="32" height="32" rx="7" fill="#1C1B1A" />
  
  <!-- Outer cellular boundary contour -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#E2DDD5" stroke-width="1.2" stroke-dasharray="2.5 1.5" opacity="0.75" />
  
  <!-- Curved Golgi organelle stack ribbon -->
  <path d="M21.5 10 C25 13.5 25 18.5 21.5 22" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Prominent cellular nucleus with luminous coral envelope -->
  <circle cx="14.8" cy="16" r="5.6" fill="#FF6B6B" />
  
  <!-- Inner nuclear chromatin core -->
  <circle cx="14.8" cy="16" r="3.1" fill="#2A2826" />
  
  <!-- Bright nucleolus accent -->
  <circle cx="15.5" cy="15.3" r="1.2" fill="#FFA09B" />
  
  <!-- Cytoplasmic organelle vesicles -->
  <circle cx="9.8" cy="11.2" r="1.3" fill="#E2DDD5" opacity="0.85" />
  <circle cx="9.2" cy="20.4" r="1.4" fill="#FF6B6B" opacity="0.9" />
</svg>
